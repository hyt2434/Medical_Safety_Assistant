<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:863px;height:250px;background:#FFFFFF;" width="863px" height="250px" viewBox="0 0 863 250" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="20"><text x="268.907" y="23.132" fill="#000" font-size="14" textLength="318.186" font-weight="700" font-family="Arial">UC-13: Share Patient Health Summary with HCP</text></g><!--cluster Medication Safety Assistant--><g class="cluster" data-qualified-name="Medication Safety Assistant" id="ent0002" data-source-line="26"><rect x="172" y="44.099" width="677" height="192" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="424.172" y="58.292" fill="#000" font-size="13" textLength="172.656" font-weight="700" font-family="Arial">Medication Safety Assistant</text></g><!--entity Main--><g class="entity" data-qualified-name="Medication Safety Assistant.Main" id="ent0003" data-source-line="27"><ellipse cx="319.774" cy="101.153" rx="105.774" ry="23.555" fill="#FFF2B3" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="230.177" y="102.533" fill="#202020" font-size="13" textLength="179.194" font-family="Arial">Share Patient Health Summary</text><text x="292.685" y="117.481" fill="#202020" font-size="13" textLength="54.177" font-family="Arial">with HCP</text></g><!--entity Consent--><g class="entity" data-qualified-name="Medication Safety Assistant.Consent" id="ent0004" data-source-line="28"><ellipse cx="690.855" cy="181.974" rx="99.855" ry="23.875" fill="#FFF2B3" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="625.096" y="178.096" fill="#202020" font-size="13" textLength="131.517" font-family="Arial">Review Sharing Scope</text><text x="621.497" y="193.045" fill="#202020" font-size="13" textLength="138.715" font-family="Arial">and Confirm Permission</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN6" id="ent0007" data-source-line="31"><path d="M188,150.099 L188,219.894 L451.766,219.894 L451.766,160.099 L441.766,150.099 L188,150.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M441.766,150.099 L441.766,160.099 L451.766,160.099 L441.766,150.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="194" y="167.292" fill="#000" font-size="13" textLength="242.766" font-family="Arial">Only the chosen summary is accessible to</text><text x="194" y="182.241" fill="#000" font-size="13" textLength="178.477" font-family="Arial">the permitted recipient or case.</text><text x="194" y="197.19" fill="#000" font-size="13" textLength="213.161" font-family="Arial">Declined permission or failed sharing</text><text x="194" y="212.139" fill="#000" font-size="13" textLength="129.346" font-family="Arial">grants no new access.</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN9" id="ent0010" data-source-line="37"><path d="M549,77.599 L549,132.445 L833.021,132.445 L833.021,87.599 L823.021,77.599 L549,77.599" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M823.021,77.599 L823.021,87.599 L833.021,87.599 L823.021,77.599" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="555" y="94.792" fill="#000" font-size="13" textLength="215.319" font-family="Arial">Warn when the summary is outdated;</text><text x="555" y="109.741" fill="#000" font-size="13" textLength="224.701" font-family="Arial">the patient may share with limits visible</text><text x="555" y="124.69" fill="#000" font-size="13" textLength="263.021" font-family="Arial">or return separately to UC-12 to regenerate it.</text></g><!--entity Actor1--><g class="entity" data-qualified-name="Actor1" id="ent0001" data-source-line="25"><ellipse cx="70.308" cy="72.099" rx="8" ry="8" fill="#F1F1F1" style="stroke:#37474F;stroke-width:0.5;"/><path d="M70.308,8