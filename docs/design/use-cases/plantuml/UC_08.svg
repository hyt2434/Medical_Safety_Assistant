h:0.5;" fill="#FEFFDD"/><path d="M466.344,162.599 L466.344,172.599 L476.344,172.599 L466.344,162.599" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="194" y="179.792" fill="#000" font-size="13" textLength="263.021" font-family="Arial">The patient reports Taken, Missed or Skipped</text><text x="194" y="194.741" fill="#000" font-size="13" textLength="195.844" font-family="Arial">for an accessible scheduled dose.</text><text x="194" y="209.69" fill="#000" font-size="13" textLength="267.344" font-family="Arial">A missing report is not proof of a missed dose.</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN9" id="ent0010" data-source-line="36"><path d="M573,77.099 L573,146.894 L831.009,146.894 L831.009,87.099 L821.009,77.099 L573,77.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M821.009,77.099 L821.009,87.099 L831.009,87.099 L821.009,77.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="579" y="94.292" fill="#000" font-size="13" textLength="231.937" font-family="Arial">Corrections show the previous status for</text><text x="579" y="109.241" fill="#000" font-size="13" textLength="214.608" font-family="Arial">comparison and require confirmation.</text><text x="579" y="124.19" fill="#000" font-size="13" textLength="232.692" font-family="Arial">Cancellation or failure changes no entry;</text><text x="579" y="139.139" fill="#000" font-size="13" textLength="237.009" font-family="Arial">the recorded time is retained on success.</text></g><!--entity Actor1--><g class="entity" data-qualified-name="Actor1" id="ent0001" data-source-line="25"><ellipse cx="70.308" cy="91.099" rx="8" ry="8" fill="#F1F1F1" style="stroke:#37474F;stroke-width:0.5;"/><path d="M70.308,99.099 L70.308,126.099 M57.308,107.099 L83.308,107.099 M70.308,126.099 L57.308,141.099 M70.308,126.099 L83.308,141.099" style="stroke:#37474F;stroke-width:0.5;" fill="none"/><text x="6" y="154.792" fill="#202020" font-size="13" textLeng