<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:876px;height:321px;background:#FFFFFF;" width="876px" height="321px" viewBox="0 0 876 321" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="20"><text x="327.528" y="23.132" fill="#000" font-size="14" textLength="213.944" font-weight="700" font-family="Arial">UC-03: Check Medication Safety</text></g><!--cluster Medication Safety Assistant--><g class="cluster" data-qualified-name="Medication Safety Assistant" id="ent0002" data-source-line="26"><rect x="172" y="44.099" width="690" height="263" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="430.672" y="58.292" fill="#000" font-size="13" textLength="172.656" font-weight="700" font-family="Arial">Medication Safety Assistant</text></g><!--entity Main--><g class="entity" data-qualified-name="Medication Safety Assistant.Main" id="ent0003" data-source-line="27"><ellipse cx="335.53" cy="191.305" rx="84.03" ry="19.206" fill="#FFF2B3" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="263.633" y="195.279" fill="#202020" font-size="13" textLength="143.793" font-family="Arial">Check Medication Safety</text></g><!--entity Identify--><g class="entity" data-qualified-name="Medication Safety Assistant.Identify" id="ent0004" data-source-line="28"><ellipse cx="713.117" cy="191.346" rx="90.117" ry="23.248" fill="#FFF2B3" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="661.092" y="186.554" fill="#202020" font-size="13" textLength="104.051" font-family="Arial">Identify Medicines</text><text x="648.799" y="201.503" fill="#202020" font-size="13" textLength="128.635" font-family="Arial">and Active Ingredients</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN6" id="ent0007" data-source-line="31"><path d="M580,103.099 L580,142.996 L845.962,142.996 L845.962,113.099 L835.962,103.099 L580,103.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M835.962,103.099 L835.962,113.099 L845.962,113.099 L835.962,103.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="586" y="120.292" fill="#000" font-size="13" textLength="244.962" font-family="Arial">Unidentified medicines remain unresolved;</text><text x="586" y="135.241" fill="#000" font-size="13" textLength="211.739" font-family="Arial">do not guess their active ingredients.</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN9" id="ent0010" data-source-line="35"><path d="M188,235.599 L188,290.445 L482.895,290.445 L482.895,245.599 L472.895,235.599 L188,235.599" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M472.895,235.599 L472.895,245.599 L482.895,245.599 L472.895,235.599" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="194" y="252.792" fill="#000" font-size="13" textLength="273.895" font-family="Arial">Run supported interaction and duplicate checks</text><text x="194" y="267.741" fill="#000" font-size="13" textLength="260.851" font-family="Arial">where assessable; show coverage and limits.</text><text x="194" y="282.69" fill="#000" font-size="13" textLength="273.857" font-family="Arial">Missing or failed checks are not safe clearance.</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN12" id="ent0013" data-source-line="40"><path d="M192,77.099 L192,146.894 L478.929,146.894 L478.929,87.099 L468.929,77.099 L192,77.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M468.929,77.099 L468.929,87.099 L478.929,87.099 L468.929,77.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="198" y="94.292" fill="#000" font-size="13" textLength="249.285" font-family="Arial">Severe findings trigger immediate warnings</text><text x="198" y="109.241" fill="#000" font-size="13" textLength="198.707" font-family="Arial">and hold affected NEW reminders.</text><text x="198" y="124.19" fill="#000" font-size="13" textLength="236.99" font-family="Arial">Existing reminders and prescriptions stay</text><text x="198" y="139.139" fill="#000" font-size="13" textLength="265.929" font-family="Arial">unchanged; recorded warnings survive failure.</text></g><!--entity Actor1--><g class="entity" data-qualified-name="Actor1" id="ent0001" data-source-line="25"><ellipse cx="70.308" cy="162.099" rx="8" ry="8" fill="#F1F1F1" style="stroke:#37474F;stroke-width:0.5;"/><path d="M70.308,170.099 L70.308,197.099 M57.308,178.099 L83.308,178.099 M70.308,197.099 L57.308,212.099 M70.308,197.099 L83.308,212.099" style="stroke:#37474F;stroke-width:0.5;" fill="none"/><text x="6" y="225.792" fill="#202020" font-size="13" textLength="128.616" font-family="Arial">Patient / General User</text></g><!--link Main to Identify--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk5" data-source-line="29" data-link-type="dependency"><path d="M419.84,191.099 C480.01,191.099 556.17,191.099 617.67,191.099" style="stroke:#455A64;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Main-to-Identify"/><polygon points="622.67,191.099,613.67,187.099,617.67,191.099,613.67,195.099,622.67,191.099" fill="#455A64" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="504" y="188.292" fill="#000" font-size="13" textLength="55.656" font-family="Arial">«include»</text></g><!--link Identify to GMN6--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk8" data-source-line="31" data-link-type="association"><path d="M713,167.869 C713,164.379 713,145.769 713,145.769 C713,145.769 713,144.829 713,143.339" style="stroke:#455A64;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Identify-GMN6"/></g><!--link GMN9 to Main--><g class="link" data-entity-1="ent0010" data-entity-2="ent0003" id="lnk11" data-source-line="35" data-link-type="