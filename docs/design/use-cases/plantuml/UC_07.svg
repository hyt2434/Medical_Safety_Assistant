t x="471" y="265.69" fill="#000" font-size="13" textLength="226.929" font-family="Arial">the existing schedule stays unchanged.</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN14" id="ent0015" data-source-line="44"><path d="M175,278.099 L175,317.996 L425.093,317.996 L425.093,288.099 L415.093,278.099 L175,278.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M415.093,278.099 L415.093,288.099 L425.093,288.099 L415.093,278.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="181" y="295.292" fill="#000" font-size="13" textLength="229.093" font-family="Arial">Cancellation or update failure keeps the</text><text x="181" y="310.241" fill="#000" font-size="13" textLength="225.424" font-family="Arial">previous settings (Alternative Flow A3).</text></g><!--entity Actor1--><g class="entity" data-qualified-name="Actor1" id="ent0001" data-source-line="25"><ellipse cx="70.308" cy="71.099" rx="8" ry="8" fill="#F1F1F1" style="stroke:#37474F;stroke-width:0.5;"/><path d="M70.308,79.099 L70.308,106.099 M57.308,87.099 L83.308,87.099 M70.308,106.099 L57.308,121.099 M70.308,106.099 L83.308,121.099" style="stroke:#37474F;stroke-width:0.5;" fill="none"/><text x="6" y="134.792" fill="#202020" font-size="13" textLength="128.616" font-family="Arial">Patient / General User</text></g><!--link Notification to Main--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" id="lnk6" data-source-line="30" data-link-type="extension"><path d="M300,147.899 C300,146.779 300,146.099 300,146.099 C300,146.099 300,123.099 300,123.099 C300,123.099 300,141.009 300,140.839" style="stroke:#455A64;stroke-width:1;" fill="none" id="Notification-to-Main"/><polygon points="300,122.839,294,140.839,306,140.839,300,122.839" fill="none" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Timing to Main--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" id="lnk7" data-source-line="31" 