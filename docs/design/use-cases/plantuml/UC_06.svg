-line="29"><ellipse cx="706.248" cy="199.148" rx="120.748" ry="26.55" fill="#FFF2B3" style="stroke:#8A6D00;stroke-width:0.5;"/><text x="624.953" y="193.561" fill="#202020" font-size="13" textLength="162.589" font-family="Arial">Check Schedule Verification</text><text x="607.611" y="208.51" fill="#202020" font-size="13" textLength="197.272" font-family="Arial">and Applicable Safety Restrictions</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN8" id="ent0009" data-source-line="33"><path d="M577.5,251.099 L577.5,320.894 L834.074,320.894 L834.074,261.099 L824.074,251.099 L577.5,251.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M824.074,251.099 L824.074,261.099 L834.074,261.099 L824.074,251.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="583.5" y="268.292" fill="#000" font-size="13" textLength="235.574" font-family="Arial">No activation without a verified schedule.</text><text x="583.5" y="283.241" fill="#000" font-size="13" textLength="234.851" font-family="Arial">Proposed new timing awaits the required</text><text x="583.5" y="298.19" fill="#000" font-size="13" textLength="228.319" font-family="Arial">simulated confirmation; review requests</text><text x="583.5" y="313.139" fill="#000" font-size="13" textLength="224.751" font-family="Arial">are handled separately through UC-04.</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN11" id="ent0012" data-source-line="39"><path d="M554,77.099 L554,146.894 L857.534,146.894 L857.534,87.099 L847.534,77.099 L554,77.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M847.534,77.099 L847.534,87.099 L857.534,87.099 L847.534,77.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="560" y="94.292" fill="#000" font-size="13" textLength="266.627" font-family="Arial">Severe findings hold affected NEW reminders;</text><text x="560" y="109.241" fill="#000" font-size="13" textLength="282.534" font-family="Arial">existing reminders are not stopped automatically.</text><text x="560" y="124.19" fill="#000" font-size="13" textLength="232.686" font-family="Arial">Unassessed is not safe clearance; apply</text><text x="560" y="139.139" fill="#000" font-size="13" textLength="234.819" font-family="Arial">restrictions required by the review policy.</text></g><g class="entity" data-qualified-name="Medication Safety Assistant.GMN14" id="ent0015" data-source-line="45"><path d="M188,300.099 L188,339.996 L456.851,339.996 L456.851,310.099 L446.851,300.099 L188,300.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M446.851,300.099 L446.851,310.099 L456.851,310.099 L446.851,300.099" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="194" y="317.292" fill="#000" font-size="13" textLength="224.707" font-family="Arial">Browser notification failure is a delivery</text><text x="194" y="332.241" fill="#000" font-size="13" textLength="247.851" font-family="Arial">limitation: eligible schedules remain in-app.</text></g><!--entity Actor1--><g class="entity" data-qualified-name="Actor1" id="ent0001" data-source-line="25"><ellipse cx="70.308" cy="224.099" rx="8" ry="8" fill="#F1F1F1" style="stroke:#37474F;stroke-width:0.5;"/><path d="M70.308,232.099 L70.308,259.099 M57.308,240.099 L83.308,240.099 M70.308,259.099 L57.308,274.099 M70.308,259.099 L83.308,274.099" style="stroke:#37474F;stroke-width:0.5;" fill="none"/><text x="6" y="287.792" fill="#202020" font-size="13" textLength="128.616" font-family="Arial">Patient / General User</text></g><!--link Main to Confirm--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk6" data-source-line="30" data-link-type="dependency"><path d="M387.9,269.499 C422.04,278.199 457,287.099 457,287.099 C457,287.099 554,334.099 554,334.099 C554,334.099 594.296,343.71 635.226,353.46" style="stroke:#455A64;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Main-to-Confirm"/><polygon points="640.09,354.619,632.